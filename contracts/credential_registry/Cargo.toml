[package]
name = "credential_registry"
version = "0.1.0"
edition = "2021"

# This contract will manage the on-chain registry of verifiable credentials.
# It stores credential hashes, issuer/holder addresses, timestamps, and
# revocation status. Credential content itself lives on IPFS.

[lib]
crate-type = ["cdylib", "rlib"]

# Integration tests live in test/ per CONTRIBUTING.md. Declared explicitly
# because cargo only auto-discovers tests/ (plural) by default.
[[test]]
name = "integration_tests"
path = "test/integration_tests.rs"

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

[[test]]
name = "integration_tests"
path = "test/integration_tests.rs"
